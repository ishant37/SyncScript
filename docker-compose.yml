services:
  mongodb:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - syncscript-mongodb:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - syncscript-redis:/data

volumes:
  syncscript-mongodb:
  syncscript-redis:
